<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gamato Piranti — Suite alat digital modern: QR code, PDF, editor dokumen, olah gambar, dan utilitas harian. Gratis, cepat, dan diproses langsung di perangkatmu." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="Gamato Piranti" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Domain resmi: https://gamatopiranti.zone.id (lihat src/lib/site.ts) -->
    <link rel="canonical" href="https://gamatopiranti.zone.id/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gamato Piranti" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:url" content="https://gamatopiranti.zone.id/" />
    <meta property="og:title" content="Gamato Piranti — Suite Alat Digital" />
    <meta property="og:description" content="QR code, PDF, editor dokumen, olah gambar, dan utilitas harian — semua gratis dan diproses langsung di perangkatmu." />
    <meta property="og:image" content="https://gamatopiranti.zone.id/gamato-piranti.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gamato Piranti — Suite Alat Digital" />
    <meta name="twitter:description" content="QR code, PDF, editor dokumen, olah gambar, dan utilitas harian — gratis dan diproses langsung di perangkatmu." />
    <meta name="twitter:image" content="https://gamatopiranti.zone.id/gamato-piranti.png" />

    <link rel="icon" type="image/png" href="/gamato-piranti-192.png" />
    <link rel="apple-touch-icon" href="/gamato-piranti-192.png" />

    <!-- Font UI (Alan Sans) di-host sendiri & di-preload → tidak ada request lintas-origin yang memblokir render pertama. -->
    <link rel="preload" href="/fonts/alan-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <title>Gamato Piranti — Suite Alat Digital</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Gamato Piranti",
        "url": "https://gamatopiranti.zone.id/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web",
        "inLanguage": "id",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
        "publisher": { "@type": "Organization", "name": "WisDev" }
      }
    </script>

    <script>
      // Alihkan host lama (alamat vercel.app lama & www) ke domain resmi, path/query/hash dipertahankan.
      // Hanya host yang persis dicocokkan — URL preview/dev/localhost tidak tersentuh sehingga pengujian tetap jalan.
      (function () {
        try {
          var h = location.hostname;
          if (h === "gamato-piranti.vercel.app" || h === "www.gamatopiranti.zone.id") {
            location.replace("https://gamatopiranti.zone.id" + location.pathname + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>

    <script>
      // Bahasa antarmuka (ID/EN): atribut lang diset sebelum paint (a11y + SEO + font), dari ?lang= atau penyimpanan lokal.
      (function () {
        try {
          var q = /[?&]lang=(en|id)\b/.exec(location.search);
          var l = q ? q[1] : localStorage.getItem("gp-lang");
          if (l === "en") document.documentElement.lang = "en";
        } catch (e) {}
      })();
    </script>

    <script>
      // Tema bawaan = TERANG (putih). Gelap hanya bila pengguna memilihnya sendiri (kunci "gp-theme-pref", ditulis saat
      // tombol tema ditekan). Dijalankan sebelum paint pertama agar tidak ada kilatan terang/gelap.
      (function () {
        try {
          if (localStorage.getItem("gp-theme-pref") === "dark") {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0f172a");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
