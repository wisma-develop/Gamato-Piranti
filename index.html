<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gamato Piranti — Suite alat digital modern: QR code, PDF, editor dokumen, olah gambar, dan utilitas harian. Gratis, cepat, dan diproses langsung di perangkatmu." />
    <meta name="theme-color" content="#0f172a" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gamato Piranti — Suite Alat Digital" />
    <meta property="og:description" content="QR code, PDF, editor dokumen, olah gambar, dan utilitas harian — semua gratis dan diproses langsung di perangkatmu." />
    <meta property="og:image" content="/gamato-piranti.png" />

    <link rel="icon" type="image/png" href="/gamato-piranti.png" />
    <link rel="apple-touch-icon" href="/gamato-piranti.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet" />

    <title>Gamato Piranti — Suite Alat Digital</title>

    <script>
      // Apply the saved/system theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem("gp-theme");
          var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
