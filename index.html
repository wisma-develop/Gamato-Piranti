<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gamato Piranti — Suite alat digital modern: QR code, PDF, editor dokumen, olah gambar, dan utilitas harian. Gratis, cepat, dan diproses langsung di perangkatmu." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="application-name" content="Gamato Piranti" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Domain resmi: https://gamatopiranti.zone.id (lihat src/lib/site.ts) -->
    <link rel="canonical" href="https://gamatopiranti.zone.id/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gamato Piranti" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:url" content="https://gamatopiranti.zone.id/" />
    <meta property="og:title" content="Gamato Piranti — Suite Alat Digital" />
    <meta property="og:description" content="QR code, PDF, editor dokumen, olah gambar, dan utilitas harian — semua gratis dan diproses langsung di perangkatmu." />
    <meta property="og:image" content="https://gamatopiranti.zone.id/gamato-piranti.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gamato Piranti — Suite Alat Digital" />
    <meta name="twitter:description" content="QR code, PDF, editor dokumen, olah gambar, dan utilitas harian — gratis dan diproses langsung di perangkatmu." />
    <meta name="twitter:image" content="https://gamatopiranti.zone.id/gamato-piranti.png" />

    <link rel="icon" type="image/png" href="/gamato-piranti.png" />
    <link rel="apple-touch-icon" href="/gamato-piranti.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font families available across every generator (Sertifikat, Kartu Nama, Invoice, Kwitansi, Struk, CV) via FontPicker — see src/lib/fontPresets.ts -->
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Great+Vibes&family=Poppins:wght@300;400;500;600;700;800;900&family=Montserrat:wght@300..900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Dancing+Script:wght@400..700&family=Oswald:wght@300..700&family=Bebas+Neue&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />

    <title>Gamato Piranti — Suite Alat Digital</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Gamato Piranti",
        "url": "https://gamatopiranti.zone.id/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web",
        "inLanguage": "id",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
        "publisher": { "@type": "Organization", "name": "WisDev" }
      }
    </script>

    <script>
      // Alihkan host lama (alamat vercel.app lama & www) ke domain resmi, path/query/hash dipertahankan.
      // Hanya host yang persis dicocokkan — URL preview/dev/localhost tidak tersentuh sehingga pengujian tetap jalan.
      (function () {
        try {
          var h = location.hostname;
          if (h === "gamato-piranti.vercel.app" || h === "www.gamatopiranti.zone.id") {
            location.replace("https://gamatopiranti.zone.id" + location.pathname + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>

    <script>
      // Apply the saved/system theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem("gp-theme");
          var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
